<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>かたちづくり てんをつなぐ ふりかえり</title><style>
*{box-sizing:border-box}body{margin:0;background:#f1f8ff;font-family:-apple-system,'Hiragino Kaku Gothic ProN',sans-serif;color:#26384a}main{max-width:860px;margin:auto;padding:18px}h1{text-align:center;font-size:clamp(30px,5vw,43px);line-height:1.45}.card{background:white;border-radius:22px;padding:24px;box-shadow:0 5px 20px #18344b15}h2{font-size:clamp(26px,4vw,34px);margin:8px 0 24px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}button{appearance:none;background:#fff;border:3px solid #b7d6ed;border-radius:18px;padding:18px 14px;min-height:100px;font:700 clamp(25px,3.6vw,33px)/1.55 -apple-system,'Hiragino Kaku Gothic ProN',sans-serif;color:#23384b;cursor:pointer;touch-action:manipulation;overflow-wrap:anywhere}button:active{background:#e4f5ff}#result{background:#fff8d9;padding:22px;border-radius:18px;font-size:clamp(29px,4.5vw,39px);font-weight:700;line-height:1.9}.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}.controls button{min-height:76px;font-size:clamp(21px,3vw,26px)}.hint{font-size:21px;line-height:1.7;text-align:center}section[hidden]{display:none!important}@media(max-width:600px){.grid{grid-template-columns:1fr}button{min-height:82px}main{padding:12px}.card{padding:17px}}
</style></head><body><main><h1>🔷 かたちづくり<br>てんを つなぐ ふりかえり</h1><section class="card" id="step1"><h2>① どんなことを ふりかえる？</h2><div class="grid" id="first"></div></section><section class="card" id="step2" hidden><h2 id="question">② えらんでね</h2><div class="grid" id="second"></div><div class="controls"><button id="back1">↩ もどる</button></div></section><section class="card" id="step3" hidden><h2>③ ふりかえりが できたよ！</h2><p class="hint">この ぶんを のーとに うつそう ✏️</p><div id="result"></div><div class="controls"><button id="voice">🔊 よんでみる</button><button id="back2">↩ えらびなおす</button><button id="home">🏠 はじめから</button></div></section></main><script>
(function(){'use strict';
const items=[
{title:'💡 わかったこと',question:'② なにが わかった？',choices:[['てんと てんを せんで つなぐと かたちが できる','てんと てんを せんで つなぐと、いろいろな かたちが できると わかりました。'],['せんの つなぎかたで かたちが かわる','おなじ てんでも、せんの つなぎかたを かえると ちがう かたちに なると わかりました。'],['てんを まっすぐな せんで つなぐ','てんと てんを まっすぐな せんで つなぐと、かたちを つくれると わかりました。'],['てんを つないで いえや はなを つくれる','てんを つなぐと、いえや はななどの かたちも つくれると わかりました。']]},
{title:'👀 きづいたこと',question:'② なにに きづいた？',choices:[['つなぐ てんを かえると ちがう かたちになる','つなぐ てんを かえると、ちがう かたちに なることに きづきました。'],['せんを つなぐと さんかくや しかくが できる','てんを せんで つなぐと、さんかくや しかくが できることに きづきました。'],['てんを とばして つなぐことも できる','となりの てんだけでなく、はなれた てんも つなげることに きづきました。'],['せんが まがると かたちが かわる','せんを まっすぐに かくか、まげて かくかで、かたちが かわることに きづきました。']]},
{title:'😊 できたこと',question:'② なにが できた？',choices:[['てんと てんを まっすぐに つないだ','てんと てんを まっすぐな せんで つなぐことが できました。'],['てんを つないで いえを つくった','てんを せんで つないで、いえの かたちを つくることが できました。'],['てんを つないで すきな かたちを つくった','てんを せんで つないで、じぶんの すきな かたちを つくることが できました。'],['せんの つなぎかたを くふうした','どの てんを つなぐか かんがえて、かたちを くふうして つくることが できました。']]},
{title:'🌱 もっと しりたいこと',question:'② もっと なにを しりたい？',choices:[['てんを つないで ほかの かたちも つくりたい','てんを つないで、もっと いろいろな かたちを つくってみたいです。'],['てんを つないで どうぶつを つくりたい','てんを つないで、どうぶつの かたちも つくってみたいです。'],['おなじ てんから なんこ かたちが できるか しりたい','おなじ てんを つかって、なんこ ちがう かたちを つくれるか しりたいです。'],['もっと たくさんの てんで つくりたい','もっと たくさんの てんを つないで、むずかしい かたちも つくってみたいです。']]}
];
const el=id=>document.getElementById(id);let selected=0;
function screen(n){[1,2,3].forEach(i=>{el('step'+i).hidden=i!==n});window.scrollTo(0,0)}
function button(label,callback){const b=document.createElement('button');b.type='button';b.textContent=label;b.addEventListener('click',callback);return b}
items.forEach((item,index)=>el('first').appendChild(button(item.title,()=>{selected=index;el('question').textContent=items[selected].question;el('second').replaceChildren();items[selected].choices.forEach(([label,sentence])=>el('second').appendChild(button(label,()=>{el('result').textContent=sentence;screen(3)})));screen(2)})));
el('back1').addEventListener('click',()=>screen(1));el('back2').addEventListener('click',()=>screen(2));el('home').addEventListener('click',()=>screen(1));el('voice').addEventListener('click',()=>{if('speechSynthesis' in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(el('result').textContent);u.lang='ja-JP';u.rate=.85;speechSynthesis.speak(u)}});
screen(1);
})();
</script></body></html>
